<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script  src="calculator.js"></script>
</head>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      border: 2px solid #555;
      text-align: center;
    }
    input[type="number"] {
      display: block;
      width: 90%;
      margin: 15px auto;
      padding: 15px;
      font-size: 20px;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 25px 0;
    }
    button {
      width: 60px;
      height: 55px;
      font-size: 20px;
      cursor: pointer;
      border: 1px solid #888;
      border-radius: 4px;
      background: #f2f2f2;
    }
    button:hover {
      background: #ddd;
    }
    #result {
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <form id="calcForm">
    <h1>Calculator</h1>

    <input type="number" id="num1" name="num1" placeholder="Enter first number" step="any" required>
    <input type="number" id="num2" name="num2" placeholder="Enter second number" step="any" required>

    <div class="buttons">
      <button type="button" onclick="calculate('+')">+</button>
      <button type="button" onclick="calculate('-')">-</button>
      <button type="button" onclick="calculate('*')">*</button>
      <button type="button" onclick="calculate('/')">/</button>
    </div>

    <h2 id="result">Result</h2>
  </form>

  <script>
    function calculate(operator) {
      const form = document.getElementById("calcForm");
      const resultEl = document.getElementById("result");

      // Uses the form's built-in validation (required fields)
      if (!form.reportValidity()) {
        return;
      }

      const num1 = parseFloat(form.num1.value);
      const num2 = parseFloat(form.num2.value);
      let result;

      switch (operator) {
        case "+": result = num1 + num2; break;
        case "-": result = num1 - num2; break;
        case "*": result = num1 * num2; break;
        case "/":
          if (num2 === 0) {
            resultEl.textContent = "Cannot divide by zero";
            return;
          }
          result = num1 / num2;
          break;
      }

      resultEl.textContent = "Result: " + result;
    }
  </script>

</body>
</html>
